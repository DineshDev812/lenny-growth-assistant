services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lenny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny}
      POSTGRES_DB: ${POSTGRES_DB:-lenny}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lenny} -d ${POSTGRES_DB:-lenny}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-Lenny Growth Assistant}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER:-lenny}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lenny}
      POSTGRES_DB: ${POSTGRES_DB:-lenny}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://lenny:lenny@postgres:5432/lenny}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-local-dev-not-for-production}
      COOKIE_NAME: ${COOKIE_NAME:-client_id}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      TRANSCRIPTS_DIR: ${TRANSCRIPTS_DIR:-/data/transcripts}
      INGEST_ON_STARTUP: ${INGEST_ON_STARTUP:-true}
      CHUNK_TARGET_TOKENS: ${CHUNK_TARGET_TOKENS:-450}
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-500}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-60}
      RETRIEVAL_MIN_SCORE: ${RETRIEVAL_MIN_SCORE:-0.03}
      RETRIEVAL_FALLBACK_MIN_SCORE: ${RETRIEVAL_FALLBACK_MIN_SCORE:-0.12}
      RETRIEVAL_MIN_ANSWER_SCORE: ${RETRIEVAL_MIN_ANSWER_SCORE:-0.08}
      GROUNDING_STRICT: ${GROUNDING_STRICT:-true}
      CONTEXT_TOKEN_BUDGET: ${CONTEXT_TOKEN_BUDGET:-3000}
      CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-6}
      LLM_FIRST_TOKEN_TIMEOUT_SECONDS: ${LLM_FIRST_TOKEN_TIMEOUT_SECONDS:-120}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-240}
      MODEL_FALLBACK: ${MODEL_FALLBACK:-none}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-20}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-4000}
    ports:
      - "8000:8000"
    volumes:
      - ./data/transcripts:/data/transcripts:ro
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
